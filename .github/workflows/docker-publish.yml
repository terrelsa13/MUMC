name: Build And Deploy MUMC Docker Container

# Controls when the action will run.
on:
  schedule:
    - cron: '0 5 * * 3'
  push:
    branches:
      #- 'latest'
      - 'MUMC-Latest'
      - 'MUMC_beta'
      - 'MUMC_alpha'
    # Publish semver tags as releases.
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      #- 'latest'
      - 'MUMC-Latest'
      - 'MUMC_beta'
      - 'MUMC_alpha'

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:

  # This workflow contains a single job called "build"
  build:

    # Base image job will run on
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install the cosign tool except on PR
      # https://github.com/sigstore/cosign-installer
      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.3'

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3

      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract MUMC Docker metadata
        id: meta_mumc
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/terrelsa13/mumc

          flavor: |
            latest=false

          tags: |
            type=raw,value=latest,enable=${{ github.ref_name == 'MUMC-Latest' || github.event_name == 'schedule' }}
            type=raw,value=alpha,enable=${{ github.ref_name == 'MUMC_alpha' }}
            type=raw,value=beta,enable=${{ github.ref_name == 'MUMC_beta' }}

            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Extract MUMC-Cron Docker metadata
        id: meta_mumc_cron
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/terrelsa13/mumc-cron

          flavor: |
            latest=false

          tags: |
            type=raw,value=latest,enable=${{ github.ref_name == 'MUMC-Latest' || github.event_name == 'schedule' }}
            type=raw,value=alpha,enable=${{ github.ref_name == 'MUMC_alpha' }}
            type=raw,value=beta,enable=${{ github.ref_name == 'MUMC_beta' }}

            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      # Build and push Docker image with Buildx (don't push on PR)
      # https://github.com/docker/build-push-action
      - name: Build and push MUMC image
        id: build_mumc
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta_mumc.outputs.tags }}
          labels: ${{ steps.meta_mumc.outputs.labels }}
          cache-from: type=gha,scope=mumc
          cache-to: type=gha,mode=max,scope=mumc
          provenance: true
          sbom: true
      - name: Sign MUMC image
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build_mumc.outputs.digest }}
        run: |
          cosign sign --yes \
            "ghcr.io/terrelsa13/mumc@${DIGEST}"


      - name: Build and push MUMC-Cron image
        id: build_mumc_cron
        uses: docker/build-push-action@v6
        with:
          context: ./docker/cron
          file: ./docker/cron/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta_mumc_cron.outputs.tags }}
          labels: ${{ steps.meta_mumc_cron.outputs.labels }}
          cache-from: type=gha,scope=mumc-cron
          cache-to: type=gha,mode=max,scope=mumc-cron
          provenance: true
          sbom: true
      - name: Sign MUMC-Cron image
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build_mumc_cron.outputs.digest }}
        run: |
          cosign sign --yes \
            "ghcr.io/terrelsa13/mumc-cron@${DIGEST}"